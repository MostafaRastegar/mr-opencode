name: Verify OpenCode Config

on:
  schedule:
    - cron: "0 6 * * 1"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify no drift
        run: python3 scripts/opc-sync.py --repo . verify
